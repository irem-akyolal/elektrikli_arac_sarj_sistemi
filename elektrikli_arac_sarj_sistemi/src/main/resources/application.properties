# ============================
# Server
# ============================
server.port=8080

# ============================
# Database (PostgreSQL)
# ============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================
# JWT
# ============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}

#============================
# OCPI Sync
#============================
ocpi.sync.locations.fixed-delay=10000
ocpi.sync.cdr.fixed-delay=300000

#============================
# Rate Limit
#============================
rate-limit.capacity=5
rate-limit.duration-minutes=1
rate-limit.protected-paths=/api/public,/api/auth


spring.profiles.active=mock





