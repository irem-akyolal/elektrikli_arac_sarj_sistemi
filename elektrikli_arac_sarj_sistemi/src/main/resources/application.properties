# ============================
# Server
# ============================
server.port=8080

# ============================
# Database (PostgreSQL)
# ============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================
# JWT
# ============================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}


# Loglama seviyesi test için DEBUG olarak ayarlandı. Üretim ortamında INFO veya WARN olarak değiştirilebilir.
logging.level.com.proje.elektrikli_arac_sarj_sistemi=INFO
logging.level.org.springframework.scheduling=INFO


